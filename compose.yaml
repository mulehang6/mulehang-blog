services:
  mysql:
    image: 'mysql:8.0'
    container_name: mulehang-blog-mysql
    environment:
      - 'MYSQL_DATABASE=mulehang_blog'
      - 'MYSQL_ROOT_PASSWORD=verysecret'
      - 'MYSQL_USER=myuser'
      - 'MYSQL_PASSWORD=secret'
      - 'TZ=Asia/Shanghai'
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - blog-network

  redis:
    image: 'redis:7-alpine'
    container_name: mulehang-blog-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - blog-network

  rabbitmq:
    image: 'rabbitmq:3.13-management-alpine'
    container_name: mulehang-blog-rabbitmq
    environment:
      - 'RABBITMQ_DEFAULT_USER=guest'
      - 'RABBITMQ_DEFAULT_PASS=guest'
    ports:
      - '5672:5672'   # AMQP port
      - '15672:15672' # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - blog-network

  # Elasticsearch (可选 - 用于搜索功能)
  # elasticsearch:
  #   image: 'docker.elastic.co/elasticsearch/elasticsearch:8.11.0'
  #   container_name: mulehang-blog-elasticsearch
  #   environment:
  #     - 'discovery.type=single-node'
  #     - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
  #     - 'xpack.security.enabled=false'
  #   ports:
  #     - '9200:9200'
  #     - '9300:9300'
  #   volumes:
  #     - elasticsearch-data:/usr/share/elasticsearch/data
  #   networks:
  #     - blog-network

  # MongoDB (可选 - 用于版本历史)
  # mongodb:
  #   image: 'mongo:7'
  #   container_name: mulehang-blog-mongodb
  #   environment:
  #     - 'MONGO_INITDB_ROOT_USERNAME=admin'
  #     - 'MONGO_INITDB_ROOT_PASSWORD=admin123'
  #     - 'MONGO_INITDB_DATABASE=mulehang_blog'
  #   ports:
  #     - '27017:27017'
  #   volumes:
  #     - mongodb-data:/data/db
  #   networks:
  #     - blog-network

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  # elasticsearch-data:
  # mongodb-data:

networks:
  blog-network:
    driver: bridge
