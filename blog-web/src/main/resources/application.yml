spring:

  # profile 不建议写在 application.yml 里：
  # - 真实敏感配置放到 application-dev.yml（本地文件，不提交）
  # - 启动时通过 --spring.profiles.active=dev 或 SPRING_PROFILES_ACTIVE=dev 指定

  profiles:
    # 默认启用 dev（当未显式指定 spring.profiles.active 时生效）。
    # 线上/生产环境请通过环境变量或启动参数显式指定 prod。
    default: dev

  jmx:
    enabled: true

  application:
    name: blog-web

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 50MB

  # 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/mulehang_blog?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000

  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # RabbitMQ 配置
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1

  # Elasticsearch 配置（Milestone 3：搜索）
  # 说明：
  # - 使用 Spring Boot 自动配置的 ES Java Client（elasticsearch-java）
  # - 默认端口按你本地 ES 设置为 9201；如需调整，用环境变量 ELASTICSEARCH_URIS 覆盖
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9201}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}

  # 邮件配置（需要时启用）
  mail:
    host: smtp.example.com
    port: 587
    username: your-email@example.com
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  # Thymeleaf 配置
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8

  # Liquibase 配置
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/master.xml
    drop-first: false

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      enabled: false
  prometheus:
    metrics:
      export:
        enabled: true

# 日志配置
logging:
  level:
    root: INFO
    com.mulehang: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'

# SpringDoc OpenAPI 配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Knife4j 配置
knife4j:
  enable: true

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# JWT 配置
jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000  # 24 小时
  refresh-expiration: 604800000  # 7 天

# 文件存储配置（XFileStorage）
dromara:
  x-file-storage:
    # 默认存储平台
    default-platform: ${XFS_DEFAULT_PLATFORM:aliyun-oss-1}

    # 阿里云 OSS 配置（支持多个）
    aliyun-oss:
      - platform: ${XFS_OSS_PLATFORM:aliyun-oss-1}
        enable-storage: true
        access-key: ${OSS_ACCESS_KEY_ID:}
        secret-key: ${OSS_ACCESS_KEY_SECRET:}
        end-point: ${OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
        bucket-name: ${OSS_BUCKET_NAME:}
        # 访问域名，注意以 “/” 结尾，例如：https://xxx.oss-cn-hangzhou.aliyuncs.com/
        domain: ${OSS_DOMAIN:}
        # 基础路径（可选）
        base-path: ${OSS_BASE_PATH:blog/}

# 存储业务配置（与 XFileStorage 的底层配置分离）
storage:
  base-path: upload/
  max-size-bytes: 20971520
  allowed-content-type-prefix: image/

  # 是否按日期分目录存放（默认启用）：upload/yyyy/MM/dd/
  enable-date-path: true
  # 日期目录格式（默认 yyyy/MM/dd）
  date-path-pattern: yyyy/MM/dd
