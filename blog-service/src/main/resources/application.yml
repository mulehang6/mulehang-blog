spring:
  application:
    name: blog-service

  data:
    redis:
      host: localhost
      port: 6379
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      database: 0

redisson:
  # 2.5/2.6: RedissonClient 配置
  # 说明：blog-web 也有 Redis 配置；这里是给 blog-service 模块自身测试/运行用
  singleServerConfig:
    address: redis://localhost:6379
    database: 0
